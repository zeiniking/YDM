name: Build YDM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract YDM project ZIP
        run: |
          unzip -q YDM-GitHub-Ready.zip -d extracted
          shopt -s dotglob
          cp -r extracted/* .
          rm -rf extracted

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YDM-APK
          path: app/build/outputs/apk/debug/*.apk
